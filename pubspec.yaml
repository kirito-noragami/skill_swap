name: skill_swap
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- مكتبات فايربيس (الأساس) ---
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  
  # --- أدوات مساعدة ---
  provider: ^6.1.2         # لإدارة البيانات
  intl: ^0.19.0            # لتنسيق التواريخ
  uuid: ^4.4.0             # لتوليد أرقام عشوائية
  timeago: ^3.6.1          # لكتابة (منذ 5 دقائق)
  shared_preferences: ^2.2.3 # لحفظ البيانات البسيطة

  # --- التصميم ---
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1     # لخطوط جميلة
  intl_phone_field: ^3.2.0
  pinput: ^5.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true